<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idea Dashboard</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/lang.css">
    <span data-i18n-title="dashTitle" style="display:none"></span>
</head>

<body>
    <div class="dashboard">
        <!-- Top Bar -->
        <header class="topbar">
            <div class="topbar-left">
                <h1 data-i18n="dashTitle">💡 Idea Dashboard</h1>
                <a href="/panel.html" class="btn btn-back" data-i18n="backToPanel">← Back to Panel</a>
            </div>
            <div class="topbar-right">
                <div id="lang-container"></div>
                <div class="search-box">
                    <input type="text" id="searchInput" data-i18n="searchPlaceholder" oninput="debounceSearch()">
                </div>
            </div>
        </header>

        <!-- Stats Cards -->
        <section class="stats-grid" id="stats-grid">
            <div class="stat-card gradient-purple">
                <div class="stat-value" id="stat-total">-</div>
                <div class="stat-label" data-i18n="totalIdeas">Total Ideas</div>
            </div>
            <div class="stat-card gradient-green">
                <div class="stat-value" id="stat-accepted">-</div>
                <div class="stat-label" data-i18n="accepted">Accepted</div>
            </div>
            <div class="stat-card gradient-orange">
                <div class="stat-value" id="stat-progress">-</div>
                <div class="stat-label" data-i18n="inProgressLabel">In Progress</div>
            </div>
            <div class="stat-card gradient-blue">
                <div class="stat-value" id="stat-completed">-</div>
                <div class="stat-label" data-i18n="completedLabel">Completed</div>
            </div>
            <div class="stat-card gradient-pink">
                <div class="stat-value" id="stat-sessions">-</div>
                <div class="stat-label" data-i18n="totalStreams">Total Streams</div>
            </div>
        </section>

        <!-- Main Content -->
        <div class="main-content">
            <section class="panel sessions-panel">
                <div class="panel-header">
                    <h2 data-i18n="streamHistory">📺 Stream History</h2>
                </div>
                <div class="sessions-list" id="sessions-list">
                    <div class="loading" data-i18n="loading">Loading...</div>
                </div>
            </section>

            <section class="panel ideas-panel">
                <div class="panel-header">
                    <h2 id="ideas-title" data-i18n="ideasTitle">Ideas</h2>
                    <div class="filter-row">
                        <select id="statusFilter" onchange="loadSessionIdeas()">
                            <option value="" data-i18n="allStatuses">All Statuses</option>
                            <option value="accepted" data-i18n="statusAccepted">Accepted</option>
                            <option value="in_progress" data-i18n="statusInProgress">In Progress</option>
                            <option value="completed" data-i18n="statusCompleted">Completed</option>
                            <option value="rejected" data-i18n="statusRejected">Rejected</option>
                            <option value="pending" data-i18n="statusPending">Pending</option>
                        </select>
                    </div>
                </div>
                <div class="ideas-detail-list" id="ideas-detail-list">
                    <div class="empty-state">
                        <div class="empty-icon">📋</div>
                        <p data-i18n="selectStream">Select a stream to view its ideas</p>
                    </div>
                </div>
            </section>
        </div>

        <!-- Top Authors -->
        <section class="panel authors-panel">
            <div class="panel-header">
                <h2 data-i18n="topAuthors">🏆 Top Authors</h2>
            </div>
            <div class="authors-grid" id="authors-grid"></div>
        </section>

        <!-- Search Results -->
        <section class="panel search-panel" id="search-panel" style="display:none;">
            <div class="panel-header">
                <h2 data-i18n="searchResults">🔍 Search Results</h2>
                <button class="btn btn-close" onclick="closeSearch()">×</button>
            </div>
            <div class="ideas-detail-list" id="search-results"></div>
        </section>
    </div>

    <script src="js/i18n.js"></script>
    <script>
        let currentSessionId = null;
        let searchTimeout = null;

        // Init language
        createLangSelector('lang-container');
        applyTranslations();

        function onLanguageChange() {
            applyTranslations();
            loadStats();
            loadSessions();
            if (currentSessionId) loadSessionIdeas();
        }

        function platformIcon(p) {
            switch (p) { case 'youtube': return '🟥'; case 'twitch': return '🟣'; case 'kick': return '🟢'; case 'test': return '🧪'; default: return '💬'; }
        }

        function statusBadge(status) {
            const key = 'badge' + status.charAt(0).toUpperCase() + status.slice(1).replace(/_(\w)/g, (m, c) => c.toUpperCase());
            const text = t(key) || status;
            return `<span class="badge ${status.replace('_', '-')}">${text}</span>`;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr + 'Z');
            return d.toLocaleDateString(undefined, { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        async function loadStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                if (data.ok) {
                    document.getElementById('stat-total').textContent = data.stats.total_ideas || 0;
                    document.getElementById('stat-accepted').textContent = data.stats.accepted || 0;
                    document.getElementById('stat-progress').textContent = data.stats.in_progress || 0;
                    document.getElementById('stat-completed').textContent = data.stats.completed || 0;
                    document.getElementById('stat-sessions').textContent = data.stats.total_sessions || 0;
                    const ag = document.getElementById('authors-grid');
                    if (data.topAuthors && data.topAuthors.length > 0) {
                        ag.innerHTML = data.topAuthors.map((a, i) => `
                            <div class="author-card">
                                <span class="author-rank">#${i + 1}</span>
                                <span class="author-name">@${a.author}</span>
                                <span class="author-stats">${a.accepted_count}/${a.idea_count} ${t('accepted_count')}</span>
                            </div>
                        `).join('');
                    } else {
                        ag.innerHTML = `<p class="empty-small">${t('noAuthors')}</p>`;
                    }
                }
            } catch (e) { console.error('Stats error:', e); }
        }

        async function loadSessions() {
            try {
                const res = await fetch('/api/sessions?limit=50');
                const data = await res.json();
                const list = document.getElementById('sessions-list');
                if (data.ok && data.sessions.length > 0) {
                    list.innerHTML = data.sessions.map(s => `
                        <div class="session-card ${currentSessionId === s.id ? 'active' : ''}" onclick="selectSession(${s.id}, '${(s.title || t('stream')).replace(/'/g, "\\'")}')">
                            <div class="session-top">
                                <span class="session-platform">${platformIcon(s.platform)} ${s.platform}</span>
                                <span class="session-date">${formatDate(s.started_at)}</span>
                            </div>
                            <div class="session-title">${s.title || `${s.platform} ${t('stream')}`}</div>
                            <div class="session-stats">
                                <span class="session-ideas">${s.total_ideas || 0} ${t('ideas')}</span>
                                <span class="session-accepted">${s.accepted_ideas || 0} ${t('accepted_count')}</span>
                            </div>
                        </div>
                    `).join('');
                } else {
                    list.innerHTML = `<div class="empty-state"><div class="empty-icon">📺</div><p>${t('noStreams')}</p></div>`;
                }
            } catch (e) { console.error('Sessions error:', e); }
        }

        async function selectSession(sessionId, title) {
            currentSessionId = sessionId;
            document.getElementById('ideas-title').textContent = `💬 ${title}`;
            document.getElementById('search-panel').style.display = 'none';
            document.querySelectorAll('.session-card').forEach(c => c.classList.remove('active'));
            event.currentTarget.classList.add('active');
            await loadSessionIdeas();
        }

        async function loadSessionIdeas() {
            if (!currentSessionId) return;
            const status = document.getElementById('statusFilter').value;
            const url = `/api/sessions/${currentSessionId}/ideas${status ? `?status=${status}` : ''}`;
            try {
                const res = await fetch(url);
                const data = await res.json();
                const list = document.getElementById('ideas-detail-list');
                if (data.ok && data.ideas.length > 0) {
                    list.innerHTML = data.ideas.map(idea => `
                        <div class="idea-detail-card">
                            <div class="idea-detail-top">
                                <span class="idea-detail-author">${platformIcon(idea.platform)} @${idea.author}</span>
                                ${statusBadge(idea.status)}
                            </div>
                            <div class="idea-detail-text">${idea.text}</div>
                            <div class="idea-detail-meta">${formatDate(idea.created_at)}</div>
                        </div>
                    `).join('');
                } else {
                    list.innerHTML = `<div class="empty-state"><div class="empty-icon">💤</div><p>${t('noIdeasFilter')}</p></div>`;
                }
            } catch (e) { console.error('Ideas error:', e); }
        }

        function debounceSearch() { clearTimeout(searchTimeout); searchTimeout = setTimeout(doSearch, 400); }

        async function doSearch() {
            const q = document.getElementById('searchInput').value.trim();
            if (q.length < 2) { document.getElementById('search-panel').style.display = 'none'; return; }
            try {
                const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
                const data = await res.json();
                const panel = document.getElementById('search-panel');
                const list = document.getElementById('search-results');
                panel.style.display = 'block';
                if (data.ok && data.results.length > 0) {
                    list.innerHTML = data.results.map(idea => `
                        <div class="idea-detail-card">
                            <div class="idea-detail-top">
                                <span class="idea-detail-author">${platformIcon(idea.platform)} @${idea.author}</span>
                                ${statusBadge(idea.status)}
                            </div>
                            <div class="idea-detail-text">${idea.text}</div>
                            <div class="idea-detail-meta">${formatDate(idea.created_at)}</div>
                        </div>
                    `).join('');
                } else {
                    list.innerHTML = `<div class="empty-state"><p>${t('noResults')}</p></div>`;
                }
            } catch (e) { console.error('Search error:', e); }
        }

        function closeSearch() { document.getElementById('search-panel').style.display = 'none'; document.getElementById('searchInput').value = ''; }

        loadStats();
        loadSessions();
    </script>
</body>

</html>
